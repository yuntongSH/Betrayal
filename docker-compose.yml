# Local one-command stack: `docker compose up --build`
# then open http://localhost:5173
services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_SERVER_URL: "ws://localhost:8787"
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
